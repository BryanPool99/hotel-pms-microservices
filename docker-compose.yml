services:
  identity-db:
    image: postgres:16-alpine
    container_name: hotel-identity-db
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data
    networks:
      - hotel-net

  inventory-db:
    image: postgres:16-alpine
    container_name: hotel-inventory-db
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
    networks:
      - hotel-net

  reservation-db:
    image: postgres:16-alpine
    container_name: hotel-reservation-db
    environment:
      POSTGRES_DB: ${RESERVATION_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - reservation_data:/var/lib/postgresql/data
    networks:
      - hotel-net

  billing-db:
    image: postgres:16-alpine
    container_name: hotel-billing-db
    environment:
      POSTGRES_DB: ${BILLING_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - billing_data:/var/lib/postgresql/data
    networks:
      - hotel-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: hotel-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hotel-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hotel-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: hotel-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTERBROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - hotel-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hotel-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hotel-local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: hotel-kafka:9092
    networks:
      - hotel-net

# ⚠️ ESTO ES LO QUE FALTABA EN TU ARCHIVO ANTERIOR
volumes:
  identity_data:
  inventory_data:
  reservation_data:
  billing_data:

networks:
  hotel-net:
    driver: bridge